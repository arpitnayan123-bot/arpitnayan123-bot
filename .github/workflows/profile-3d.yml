name: Generate 3D Contribution Graph

on:
  schedule:
    # weekly — Sunday 18:00 UTC (a living graph does not need daily rebuilds)
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      # Standard palettes — kept as public fallbacks referenced by the README
      - name: Generate standard 3D profiles
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Profile palette — midnight navy background, blue→violet contribution ramp
      # (defined in profile-3d-settings.json, rendered as profile-blueviolet.svg)
      - name: Generate profile-palette 3D profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ${{ github.workspace }}/profile-3d-settings.json

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff-index --quiet HEAD || (git commit -m "Generated 3D Profile Contrib" && git push)
